name: CI

on:
  push:
    branches: [prototype, master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        build-tool: [maven, gradle]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: ${{ matrix.build-tool }}

      - name: Cache lego-flow local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/ssg
          key: ${{ runner.os }}-m2-legoflow-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-legoflow-

      - name: Install lego-flow to local Maven
        run: |
          cd /tmp
          git clone https://github.com/000ssg/lego-flow.git --depth 1
          cd lego-flow
          mvn install -DskipTests -pl messaging/wamp -am

      - name: Build with Maven
        if: matrix.build-tool == 'maven'
        run: mvn clean verify -B

      - name: Build with Gradle
        if: matrix.build-tool == 'gradle'
        run: ./gradlew clean build --no-daemon
